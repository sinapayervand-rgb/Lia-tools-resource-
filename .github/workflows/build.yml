name: Build Lia Tools APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract LiaTools source
        run: |
          unzip -o LiaTools_v1_source.zip -d source

      - name: Show files
        run: |
          ls -R source | head -100

      - name: Find Gradle project
        run: |
          find source -name "gradlew" -type f

      - name: Build APK
        run: |
          GRADLE_PATH=$(find source -name "gradlew" -type f | head -1)
          PROJECT_DIR=$(dirname "$GRADLE_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiaTools-APK
          path: "**/build/outputs/apk/**/*.apk"
