name: Build Lia Tools APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract LiaTools source
        run: |
          unzip -o LiaTools_v1_source.zip -d source

      - name: Find Gradle project
        run: |
          echo "Searching project..."
          find source -name "gradlew" -type f

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find source -name gradlew -type f | head -1)")
          echo "Project folder: $PROJECT"
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiaTools-APK
          path: "**/build/outputs/apk/release/*.apk"          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiaTools-APK
          path: project/**/build/outputs/apk/release/*.apk
