name: Build Lia Tools APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          unzip -o LiaTools_v1_source.zip -d project

      - name: Find project folder
        run: |
          ls -la
          find project -maxdepth 2 -type f -name "settings.gradle*" -o -name "build.gradle*"

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiaTools-APK
          path: project/**/build/outputs/apk/release/*.apk
