name: Build Lia Tools APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract project
        run: |
          unzip -o LiaTools_v1_source.zip -d source
          ls -la source

      - name: Find project
        run: |
          find source -name "settings.gradle*" -o -name "build.gradle*"

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find source -name settings.gradle.kts -o -name settings.gradle | head -1)")
          echo "Building from: $PROJECT"
          cd "$PROJECT"
          gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiaTools-APK
          path: "**/build/outputs/apk/**/*.apk"
